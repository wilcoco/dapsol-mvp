<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>{% block title %}답설 · 다음 사람의 길{% endblock %}</title><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head>
<body><header class="top"><a class="brand" href="/" aria-label="답설 홈"><span class="mark">◒</span> 답설 <span class="pilot">MVP</span></a>

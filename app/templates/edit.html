{% extends 'base.html' %}{% from 'macros.html' import csrf_field,answer_fields %}{% block content %}<div class="editor"><a href="/questions/{{r.question_id}}" class="back">← 원래 질문</a><h1>더 나은 답으로 다듬기</h1><p class="lede">이전 답과 당시의 선택·투자는 보존됩니다. 새 내용은 {{r.number+1}}번째 버전으로 남습니다.</p><form class="panel" method="post">{{csrf_field(csrf)}}<input type="hidden" name="expected_revision" value="{{r.id}}">{{answer_fields(r)}}<label>무엇을 왜 바꾸었나요?<textarea name="reason" rows="2" required maxlength="2000"></textarea></label><label>반영한 보강·정정<select name="contribution"><option value="">이번에 반영한 제안 없음</option>{% for c in contributions %}<option value="{{c.id}}">{{c.author}} · {{c.body[:100]}}</option>{% endfor %}</select></label><p class="field-help">선택한 제안의 작성자가 함께 다듬은 사람으로 표시됩니다. 이전 기여자의 기록도 유지됩니다.</p><label>추가로 참고한 답의 버전 ID<input name="sources" placeholder="선택 · 공백으로 구분"></label><button class="dark">새 버전 남기기</button></form></div>{% endblock %}
